name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tipos, lint, formatação e testes de unidade
      - run: npm run check
      - run: npm run build
      # Os testes no navegador rodam contra o build de produção. Basta o Chromium sem
      # interface (--only-shell): o Ubuntu da CI já tem as bibliotecas dele, e o
      # --with-deps (que as instala de novo pelo apt) levava quase 3 minutos. O navegador
      # fica em cache, pela versão do Playwright.
      - id: playwright
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-do-playwright
          path: test-results/
          retention-days: 7
