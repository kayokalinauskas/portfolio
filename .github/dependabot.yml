# Avisa (com um pull request) quando sai versão nova das dependências e das actions.
# As atualizações pequenas vêm juntas, num PR só por semana.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
